<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeuralWeave — AstroFlux</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #000;
      --surface: #080808;
      --border:  #1c1c1c;
      --dim:     #333;
      --muted:   #4a4a4a;
      --text:    #e6e6e6;
      --sub:     #303030;
      --accent:  #5e5e5e;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }

    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 740px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .logo-group { display: flex; align-items: center; gap: 12px; }

    .logo-mark {
      width: 34px; height: 34px; border-radius: 6px;
      border: 1px solid var(--dim);
      display: grid; place-items: center;
    }
    .logo-mark svg { width: 18px; height: 18px; }

    .brand { font-family: 'Syne', sans-serif; }
    .brand-co  { font-size: .6rem; font-weight: 700; color: var(--muted); letter-spacing: .22em; text-transform: uppercase; }
    .brand-ai  { font-size: 1.08rem; font-weight: 800; color: var(--text); letter-spacing: -.02em; line-height: 1.1; }

    .controls { display: flex; gap: 12px; align-items: center; }
    .icon-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      transition: color .2s; display: grid; place-items: center;
    }
    .icon-btn:hover { color: var(--text); }
    .icon-btn svg { width: 18px; height: 18px; }

    .status { display: flex; align-items: center; gap: 6px; font-size: .64rem; color: var(--muted); letter-spacing: .08em; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; background: #00ff66;
      box-shadow: 0 0 8px #00ff66;
    }

    #messages {
      overflow-y: auto; padding: 30px 0;
      display: flex; flex-direction: column; gap: 22px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg { display: flex; gap: 11px; animation: rise .28s ease both; position: relative; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .msg.user { flex-direction: row-reverse; }

    .av {
      width: 27px; height: 27px; border-radius: 5px; flex-shrink: 0;
      display: grid; place-items: center;
      font-family: 'Syne', sans-serif; font-size: .58rem; font-weight: 800; letter-spacing: .03em;
      background: var(--surface); border: 1px solid var(--border);
    }
    .av.ai  { color: var(--text); border-color: var(--dim); }
    .av.usr { color: var(--muted); }

    .bub {
      max-width: 80%; padding: 11px 14px; border-radius: 10px;
      font-size: .85rem; line-height: 1.6; word-wrap: break-word;
    }
    .msg.ai   .bub { background: var(--surface); border: 1px solid var(--border); border-radius: 3px 10px 10px 10px; position: relative; }
    .msg.user .bub { background: #0b0b0b; border: 1px solid var(--border); color: #ccc; border-radius: 10px 3px 10px 10px; }

    /* Markdown Styles */
    .bub pre { background: #050505; padding: 10px; border-radius: 6px; border: 1px solid var(--border); overflow-x: auto; margin: 8px 0; font-size: 0.75rem;}
    .bub code { background: #111; padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.8rem;}
    .bub pre code { background: none; padding: 0; }
    .bub p { margin-bottom: 8px; }
    .bub p:last-child { margin-bottom: 0; }

    .copy-btn {
      position: absolute; top: 8px; right: 8px; background: var(--bg); border: 1px solid var(--border);
      color: var(--muted); border-radius: 4px; width: 22px; height: 22px; cursor: pointer;
      display: grid; place-items: center; opacity: 0; transition: opacity 0.2s;
    }
    .msg.ai:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--text); border-color: var(--dim); }
    .copy-btn svg { width: 12px; height: 12px; }

    .dots { display: flex; gap: 4px; align-items: center; padding: 3px 0; }
    .dots span {
      width: 5px; height: 5px; border-radius: 50%; background: var(--dim);
      animation: blink 1.4s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: .22s; }
    .dots span:nth-child(3) { animation-delay: .44s; }
    @keyframes blink { 0%,80%,100% { opacity: .12; } 40% { opacity: .7; } }

    #bar { padding: 15px 0 26px; border-top: 1px solid var(--border); }
    .row { display: flex; gap: 8px; }

    #inp {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 14px;
      font-family: 'DM Mono', monospace; font-size: .8rem; color: var(--text);
      resize: none; outline: none; transition: border-color .15s;
      min-height: 44px; max-height: 120px;
    }
    #inp:focus { border-color: var(--dim); }
    #inp::placeholder { color: var(--sub); }

    #btn {
      width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0;
      background: var(--surface); border: 1px solid var(--dim);
      cursor: pointer; display: grid; place-items: center;
      transition: border-color .15s, background .15s;
    }
    #btn:hover:not(:disabled) { background: #111; border-color: #666; }
    #btn:active:not(:disabled) { background: #0a0a0a; }
    #btn:disabled { opacity: .2; cursor: not-allowed; }
    #btn svg { width: 15px; height: 15px; }

    .foot { font-size: .6rem; color: var(--sub); margin-top: 9px; text-align: center; letter-spacing: .07em; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo-group">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e6e6e6" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand">
        <div class="brand-co">AstroFlux</div>
        <div class="brand-ai">NeuralWeave</div>
      </div>
    </div>
    
    <div class="controls">
      <div class="status"><div class="dot"></div><span>ONLINE</span></div>
      
      <button class="icon-btn" id="clear-btn" title="Clear Chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </header>

  <div id="messages"></div>

  <div id="bar">
    <div class="row">
      <textarea id="inp" rows="1" placeholder="Message NeuralWeave…"></textarea>
      <button id="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="foot">NeuralWeave · AstroFlux © 2026 · Powered by Groq</div>
  </div>

</div>

<script>
  // ==========================================
  // PASTE YOUR GROQ API KEY HERE:
  const apiKey = 'YOUR_GROQ_API_KEY_HERE';
  // ==========================================

  const STORAGE_KEY = 'astroflux_groq_history';
  let log = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  const feed = document.getElementById('messages');
  const inp  = document.getElementById('inp');
  const btn  = document.getElementById('btn');

  // Basic Markdown Parser
  function parseMarkdown(text) {
    let html = text
      .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>') // Code blocks
      .replace(/`([^`]+)`/g, '<code>$1</code>')                   // Inline code
      .replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>')        // Bold
      .replace(/\*([^\*]+)\*/g, '<em>$1</em>')                    // Italic
      .replace(/\n\n/g, '</p><p>')                                // Double newline
      .replace(/\n/g, '<br>');                                    // Single newline
    return `<p>${html}</p>`;
  }

  function initChat() {
    feed.innerHTML = '';
    
    if (log.length === 0) {
      renderMessage('ai', "NeuralWeave initialized via Groq infrastructure.\n\nSystems are online and ready. How can I assist you today?", false);
    } else {
      log.forEach(msg => {
        if (msg.role !== 'system') renderMessage(msg.role === 'user' ? 'user' : 'ai', msg.content, false);
      });
    }
  }

  function renderMessage(role, text, save = true) {
    const w = document.createElement('div');
    w.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    
    const a = document.createElement('div');
    a.className = 'av ' + (role === 'user' ? 'usr' : 'ai');
    a.textContent = role === 'user' ? 'YOU' : 'NW';
    
    const b = document.createElement('div');
    b.className = 'bub';
    
    if (role === 'user') {
      b.textContent = text; 
    } else {
      b.innerHTML = parseMarkdown(text);
      
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.title = 'Copy text';
      copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text);
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        setTimeout(() => {
          copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
        }, 2000);
      };
      w.appendChild(copyBtn);
    }
    
    w.append(a, b);
    feed.append(w);
    feed.scrollTop = feed.scrollHeight;

    if (save) {
      log.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
    }
  }

  function showTyping() {
    const w = document.createElement('div');
    w.className = 'msg ai'; w.id = 'typing';
    const a = document.createElement('div');
    a.className = 'av ai'; a.textContent = 'NW';
    const b = document.createElement('div');
    b.className = 'bub';
    b.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    w.append(a, b);
    feed.append(w);
    feed.scrollTop = feed.scrollHeight;
  }

  function hideTyping() { document.getElementById('typing')?.remove(); }

  async function send() {
    const text = inp.value.trim();
    if (!text) return;
    
    if (apiKey === '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') {
      alert("Please edit the HTML file and insert your Groq API key on line 160.");
      return;
    }

    inp.value = ''; 
    inp.style.height = 'auto';
    btn.disabled = true;
    
    renderMessage('user', text, true);
    showTyping();

    const apiMessages = [
      { role: 'system', content: 'You are NeuralWeave, an advanced AI assistant built by AstroFlux. Be precise, insightful, and professional with a subtle futuristic tone.' },
      ...log
    ];

    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: 'llama-3.3-70b-versatile',
          messages: apiMessages,
          temperature: 0.7
        })
      });
      
      const data = await res.json();
      hideTyping();
      
      if (!res.ok || !data.choices?.[0]) {
        renderMessage('ai', '⚠ Error: ' + (data.error?.message || 'Connection failed.'), false);
        log.pop();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
      } else {
        renderMessage('ai', data.choices[0].message.content, true);
      }
    } catch (err) {
      hideTyping();
      renderMessage('ai', '⚠ Local Error: ' + err.message, false);
      log.pop();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
    }

    btn.disabled = false;
    inp.focus();
  }

  // Event Listeners
  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  btn.addEventListener('click', send);

  document.getElementById('clear-btn').addEventListener('click', () => {
    if(confirm("Wipe neural pathways (Clear chat history)?")) {
      log = [];
      localStorage.removeItem(STORAGE_KEY);
      initChat();
    }
  });

  // Init
  initChat();
</script>
</body>
</html>
