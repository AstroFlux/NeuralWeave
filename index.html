<!DOCTYPE html>
<html lang="en" data-theme="original">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>NeuralWeave — AstroFlux AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* --- CYBER / SLEEK THEME PALETTES --- */
    :root[data-theme="original"] {
      --bg:      #030508;
      --surface: #0a0f18;
      --panel:   rgba(10, 15, 24, 0.75);
      --border:  rgba(0, 255, 102, 0.15);
      --border-focus: rgba(0, 255, 102, 0.5);
      --muted:   #6b7c93;
      --text:    #f0f4f8;
      --accent:  #00ff66;
      --accent-glow: rgba(0, 255, 102, 0.25);
    }
    :root[data-theme="cyberpunk"] {
      --bg:      #07050d;
      --surface: #120e22;
      --panel:   rgba(18, 14, 34, 0.75);
      --border:  rgba(255, 0, 85, 0.25);
      --border-focus: rgba(255, 0, 85, 0.6);
      --muted:   #8c7ea8;
      --text:    #00ffff;
      --accent:  #ff0055;
      --accent-glow: rgba(255, 0, 85, 0.3);
    }
    :root[data-theme="emerald"] {
      --bg:      #020a06;
      --surface: #071910;
      --panel:   rgba(7, 25, 16, 0.75);
      --border:  rgba(0, 220, 100, 0.2);
      --border-focus: rgba(0, 220, 100, 0.5);
      --muted:   #629075;
      --text:    #e2fceb;
      --accent:  #00dc64;
      --accent-glow: rgba(0, 220, 100, 0.25);
    }
    :root[data-theme="solar"] {
      --bg:      #0d0803;
      --surface: #1b1207;
      --panel:   rgba(27, 18, 7, 0.75);
      --border:  rgba(255, 140, 0, 0.2);
      --border-focus: rgba(255, 140, 0, 0.5);
      --muted:   #9c7c54;
      --text:    #fff2e0;
      --accent:  #ff8c00;
      --accent-glow: rgba(255, 140, 0, 0.25);
    }
    :root[data-theme="ocean"] {
      --bg:      #030812;
      --surface: #0a1426;
      --panel:   rgba(10, 20, 38, 0.75);
      --border:  rgba(0, 136, 255, 0.2);
      --border-focus: rgba(0, 136, 255, 0.5);
      --muted:   #5b82a8;
      --text:    #e0f0ff;
      --accent:  #0088ff;
      --accent-glow: rgba(0, 136, 255, 0.3);
    }

    html, body {
      height: 100vh;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* Ambient background glow elements */
    body::before {
      content: '';
      position: absolute;
      top: -20%; left: -20%;
      width: 70vw; height: 70vw;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0.4;
      z-index: 0;
      pointer-events: none;
      filter: blur(60px);
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 16px;
      position: relative;
      z-index: 1;
    }

    /* --- HEADER --- */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      background: transparent;
      flex-shrink: 0;
    }

    .logo-group { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 38px; height: 38px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      display: grid; place-items: center;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .logo-mark svg { width: 20px; height: 20px; stroke: var(--accent); }

    .brand-co { font-size: .65rem; font-weight: 600; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; }
    .brand-ai { font-size: 1.15rem; font-weight: 700; color: var(--text); letter-spacing: -.01em; }

    .controls { display: flex; gap: 12px; align-items: center; }
    
    .theme-select {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      font-family: 'Outfit', sans-serif; font-size: .75rem; font-weight: 500;
      padding: 6px 10px; border-radius: 8px; outline: none; cursor: pointer;
      transition: all 0.2s; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .theme-select:hover { border-color: var(--border-focus); }

    .icon-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      width: 34px; height: 34px; border-radius: 8px; cursor: pointer;
      display: grid; place-items: center; transition: all 0.2s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--border-focus); }
    .icon-btn svg { width: 16px; height: 16px; }

    .status { display: flex; align-items: center; gap: 6px; font-size: .7rem; font-weight: 500; color: var(--muted); }
    .dot {
      width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    @media (max-width: 600px) {
      .status { display: none; }
    }

    /* --- CHAT FEED --- */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 4px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .msg { display: flex; gap: 12px; animation: rise .3s cubic-bezier(0.16, 1, 0.3, 1) both; position: relative; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .msg.user { flex-direction: row-reverse; }

    .av {
      width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
      display: grid; place-items: center;
      font-size: .7rem; font-weight: 700;
      background: var(--surface); border: 1px solid var(--border);
    }
    .av.ai  { color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .av.usr { color: var(--muted); }

    .bub {
      max-width: 80%; padding: 14px 18px; border-radius: 14px;
      font-size: .92rem; line-height: 1.6; word-wrap: break-word;
    }
    .msg.ai   .bub { 
      background: var(--panel); backdrop-filter: blur(12px); 
      border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .msg.user .bub { 
      background: linear-gradient(135deg, var(--surface), rgba(255,255,255,0.03)); 
      border: 1px solid var(--border-focus); color: var(--text); 
      border-radius: 16px 4px 16px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    .bub pre { background: var(--bg); padding: 12px; border-radius: 8px; border: 1px solid var(--border); overflow-x: auto; margin: 10px 0; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; }
    .bub code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--accent); }
    .bub pre code { background: none; padding: 0; color: var(--text); }
    .bub p { margin-bottom: 8px; }
    .bub p:last-child { margin-bottom: 0; }

    .chat-img { max-width: 100%; width: 280px; border-radius: 8px; border: 1px solid var(--border); margin: 6px 0; display: block; object-fit: cover; }

    /* Interactive Quiz Styling */
    .quiz-container { background: var(--bg); border: 1px solid var(--border-focus); border-radius: 12px; padding: 16px; margin: 12px 0; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .quiz-question { font-weight: 600; margin-bottom: 12px; color: var(--text); font-size: .95rem; }
    .quiz-options { display: flex; flex-direction: column; gap: 8px; }
    .quiz-opt-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 10px 14px; border-radius: 8px; text-align: left; cursor: pointer;
      font-family: 'Outfit', sans-serif; font-size: .88rem; transition: all 0.2s;
    }
    .quiz-opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--border); }
    .quiz-opt-btn.correct { background: rgba(0, 255, 102, 0.2) !important; border-color: #00ff66 !important; color: #00ff66 !important; font-weight: 600; }
    .quiz-opt-btn.incorrect { background: rgba(255, 0, 85, 0.2) !important; border-color: #ff0055 !important; color: #ff0055 !important; }

    .copy-btn {
      position: absolute; top: 10px; right: 10px; background: var(--surface); border: 1px solid var(--border);
      color: var(--muted); border-radius: 6px; width: 26px; height: 26px; cursor: pointer;
      display: grid; place-items: center; opacity: 0; transition: all 0.2s;
    }
    .msg.ai:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .copy-btn svg { width: 13px; height: 13px; }

    .dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .dots span {
      width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
      animation: blink 1.4s ease-in-out infinite; box-shadow: 0 0 8px var(--accent);
    }
    .dots span:nth-child(2) { animation-delay: .22s; }
    .dots span:nth-child(3) { animation-delay: .44s; }
    @keyframes blink { 0%,80%,100% { opacity: .2; } 40% { opacity: 1; } }

    /* --- INPUT BAR --- */
    #bar {
      padding: 14px 0 20px;
      border-top: 1px solid var(--border);
      background: transparent;
      flex-shrink: 0;
    }
    
    #attachment-preview {
      display: none; align-items: center; gap: 10px; padding: 8px 12px;
      background: var(--surface); border: 1px solid var(--border-focus); border-radius: 8px;
      margin-bottom: 10px; font-size: .8rem; color: var(--muted);
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    #attachment-preview img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
    #remove-attachment { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: bold; margin-left: auto; font-size: 1rem; }

    .row { display: flex; gap: 10px; align-items: flex-end; }

    #inp {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 16px;
      font-family: 'Outfit', sans-serif; font-size: .92rem; color: var(--text);
      resize: none; outline: none; transition: all 0.2s;
      min-height: 48px; max-height: 140px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
    }
    #inp:focus { border-color: var(--border-focus); box-shadow: 0 0 15px var(--accent-glow), inset 0 2px 6px rgba(0,0,0,0.2); }
    #inp::placeholder { color: var(--muted); opacity: 0.8; }

    .action-btn {
      width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
      background: var(--surface); border: 1px solid var(--border);
      cursor: pointer; display: grid; place-items: center;
      transition: all 0.2s; color: var(--muted);
    }
    .action-btn:hover { border-color: var(--border-focus); color: var(--text); }
    .action-btn svg { width: 18px; height: 18px; stroke: currentColor; }

    #btn { border-color: var(--border-focus); background: var(--surface); color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
    #btn:hover:not(:disabled) { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    #btn:disabled { opacity: .3; cursor: not-allowed; box-shadow: none; }
    #btn svg { stroke: currentColor; }

    .foot { font-size: .65rem; color: var(--muted); margin-top: 10px; text-align: center; letter-spacing: .05em; opacity: 0.8; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo-group">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand">
        <div class="brand-co">AstroFlux</div>
        <div class="brand-ai">NeuralWeave</div>
      </div>
    </div>
    
    <div class="controls">
      <select id="theme-select" class="theme-select" title="Select Color Theme">
        <option value="original">Neon Green</option>
        <option value="cyberpunk">Cyberpunk Pink</option>
        <option value="emerald">Emerald Matrix</option>
        <option value="solar">Solar Amber</option>
        <option value="ocean">Ocean Blue</option>
      </select>
      <div class="status"><div class="dot"></div><span>ONLINE</span></div>
      <button class="icon-btn" id="clear-btn" title="Clear Chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </header>

  <div id="messages"></div>

  <div id="bar">
    <div id="attachment-preview">
      <img id="preview-thumb" src="" alt="preview"/>
      <span id="preview-name">File attached</span>
      <button id="remove-attachment" title="Remove">×</button>
    </div>
    <div class="row">
      <input type="file" id="file-inp" style="display: none;" accept="image/*,.txt,.md,.js,.json,.html,.css"/>
      <button class="action-btn" id="file-btn" title="Attach Image or File">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea id="inp" rows="1" placeholder="Type a message, ask for an interactive quiz, or type /image [prompt]..."></textarea>
      <button class="action-btn" id="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="foot">NeuralWeave · AstroFlux AI © 2026 · Powered by Groq</div>
  </div>

</div>

<script>
  // ==========================================
  // PASTE YOUR GROQ API KEY INSIDE THE QUOTES:
  const apiKey = 'PASTE_YOUR_GROQ_KEY_HERE';
  // ==========================================

  const STORAGE_KEY = 'astroflux_groq_history';
  const THEME_KEY = 'astroflux_theme';
  let log = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  let attachedFile = null;

  const feed = document.getElementById('messages');
  const inp  = document.getElementById('inp');
  const btn  = document.getElementById('btn');
  const fileBtn = document.getElementById('file-btn');
  const fileInp = document.getElementById('file-inp');
  const preview = document.getElementById('attachment-preview');
  const previewThumb = document.getElementById('preview-thumb');
  const previewName = document.getElementById('preview-name');
  const removeAttachment = document.getElementById('remove-attachment');
  const themeSelect = document.getElementById('theme-select');

  // Theme Management
  const savedTheme = localStorage.getItem(THEME_KEY) || 'original';
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeSelect.value = savedTheme;

  themeSelect.addEventListener('change', (e) => {
    const chosenTheme = e.target.value;
    document.documentElement.setAttribute('data-theme', chosenTheme);
    localStorage.setItem(THEME_KEY, chosenTheme);
  });

  // File Handling
  fileBtn.addEventListener('click', () => fileInp.click());

  fileInp.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    if (file.type.startsWith('image/')) {
      reader.onload = (uploadEvent) => {
        attachedFile = { type: 'image', data: uploadEvent.target.result, name: file.name };
        previewThumb.src = uploadEvent.target.result;
        previewThumb.style.display = 'block';
        previewName.textContent = file.name;
        preview.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = (uploadEvent) => {
        attachedFile = { type: 'text', data: uploadEvent.target.result, name: file.name };
        previewThumb.style.display = 'none';
        previewName.textContent = '📄 ' + file.name;
        preview.style.display = 'flex';
      };
      reader.readAsText(file);
    }
  });

  removeAttachment.addEventListener('click', () => {
    attachedFile = null;
    fileInp.value = '';
    preview.style.display = 'none';
  });

  function parseMarkdown(text) {
    let html = text
      .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^\*]+)\*/g, '<em>$1</em>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    return `<p>${html}</p>`;
  }

  function renderQuizWidgets(container, text) {
    const jsonMatch = text.match(/```json([\s\S]*?)```/) || text.match(/```([\s\S]*?)```/);
    if (!jsonMatch) {
      container.innerHTML = parseMarkdown(text);
      return;
    }

    try {
      let parsed = JSON.parse(jsonMatch[1].trim());
      if (!Array.isArray(parsed)) parsed = [parsed];

      if (parsed[0] && parsed[0].question && parsed[0].options) {
        container.innerHTML = parseMarkdown(text.replace(jsonMatch[0], ''));
        
        parsed.forEach((q, qIndex) => {
          const quizDiv = document.createElement('div');
          quizDiv.className = 'quiz-container';
          
          let optionsHtml = '';
          q.options.forEach((opt, oIndex) => {
            optionsHtml += `<button class="quiz-opt-btn" data-correct="${oIndex === q.correct}" onclick="handleQuizAnswer(this, ${q.correct}, ${oIndex})">${opt}</button>`;
          });

          quizDiv.innerHTML = `
            <div class="quiz-question">Q${qIndex + 1}: ${q.question}</div>
            <div class="quiz-options">${optionsHtml}</div>
          `;
          container.appendChild(quizDiv);
        });
        return;
      }
    } catch (e) {}
    container.innerHTML = parseMarkdown(text);
  }

  window.handleQuizAnswer = function(btnElement, correctIndex, chosenIndex) {
    const parent = btnElement.parentElement;
    const buttons = parent.querySelectorAll('.quiz-opt-btn');
    
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === correctIndex) btn.classList.add('correct');
      if (idx === chosenIndex && idx !== correctIndex) btn.classList.add('incorrect');
    });
  };

  function initChat() {
    feed.innerHTML = '';
    if (log.length === 0) {
      renderMessage('ai', "NeuralWeave is online and fully synchronized.\n\n✨ **What you can do:**\n• Chat casually or ask complex questions\n• Type `/image [prompt]` to generate AI art\n• Ask for a multi-choice trivia quiz\n• Upload images or code files for instant analysis", false);
    } else {
      log.forEach(msg => {
        if (msg.role !== 'system') {
          let content = typeof msg.content === 'string' ? msg.content : msg.content.find(c => c.type === 'text')?.text || '';
          renderMessage(msg.role === 'user' ? 'user' : 'ai', content, false, null);
        }
      });
    }
  }

  function renderMessage(role, text, save = true, fileObj = null, isImageCard = false, imageUrl = '') {
    const w = document.createElement('div');
    w.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    
    const a = document.createElement('div');
    a.className = 'av ' + (role === 'user' ? 'usr' : 'ai');
    a.textContent = role === 'user' ? 'YOU' : 'NW';
    
    const b = document.createElement('div');
    b.className = 'bub';
    
    if (role === 'user') {
      if (fileObj && fileObj.type === 'image') {
        const img = document.createElement('img');
        img.src = fileObj.data;
        img.className = 'chat-img';
        b.appendChild(img);
      }
      const txtSpan = document.createElement('span');
      txtSpan.textContent = text;
      b.appendChild(txtSpan);
    } else {
      if (isImageCard && imageUrl) {
        b.innerHTML = parseMarkdown(text);
        const img = document.createElement('img');
        img.src = imageUrl;
        img.className = 'chat-img';
        b.appendChild(img);
      } else {
        renderQuizWidgets(b, text);
      }

      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.title = 'Copy text';
      copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text);
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        setTimeout(() => {
          copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
        }, 2000);
      };
      w.appendChild(copyBtn);
    }
    
    w.append(a, b);
    feed.append(w);
    feed.scrollTop = feed.scrollHeight;

    if (save) {
      log.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
    }
  }

  function showTyping() {
    const w = document.createElement('div');
    w.className = 'msg ai'; w.id = 'typing';
    const a = document.createElement('div');
    a.className = 'av ai'; a.textContent = 'NW';
    const b = document.createElement('div');
    b.className = 'bub';
    b.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    w.append(a, b);
    feed.append(w);
    feed.scrollTop = feed.scrollHeight;
  }

  function hideTyping() { document.getElementById('typing')?.remove(); }

  async function send() {
    let text = inp.value.trim();
    if (!text && !attachedFile) return;

    let fullPrompt = text;
    if (attachedFile && attachedFile.type === 'text') {
      fullPrompt += `\n\n[Attached File: ${attachedFile.name}]\n${attachedFile.data}`;
    }

    inp.value = ''; 
    inp.style.height = 'auto';
    btn.disabled = true;

    let currentFile = attachedFile;
    renderMessage('user', text || `[Attached: ${currentFile.name}]`, true, currentFile);

    attachedFile = null;
    preview.style.display = 'none';
    fileInp.value = '';

    showTyping();

    if (text.toLowerCase().startsWith('/image') || text.toLowerCase().startsWith('generate an image') || text.toLowerCase().startsWith('draw ')) {
      let imagePrompt = text.replace(/^\/image\s*/i, '').replace(/^generate an image of\s*/i, '').replace(/^draw\s*/i, '');
      const encodedPrompt = encodeURIComponent(imagePrompt);
      const generatedImageUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=768&height=512&nologo=true`;

      const imgLoader = new Image();
      imgLoader.src = generatedImageUrl;
      imgLoader.onload = () => {
        hideTyping();
        const responseText = `Here is your generated image for: "${imagePrompt}"`;
        renderMessage('ai', responseText, true, null, true, generatedImageUrl);
        btn.disabled = false;
        inp.focus();
      };
      imgLoader.onerror = () => {
        hideTyping();
        renderMessage('ai', '⚠ Failed to generate image. Please try a different prompt.', false);
        btn.disabled = false;
        inp.focus();
      };
      return;
    }

    let systemInstruction = 'You are NeuralWeave, an advanced, engaging, and friendly AI assistant built by AstroFlux. When the user requests a quiz, format your response as a JSON code block like this: ```json[{"question": "...", "options": ["A", "B", "C", "D"], "correct": 0}]``` where correct is the index (0-3) of the right option.';

    let userContentPayload = fullPrompt;
    let activeModel = 'openai/gpt-oss-20b';

    if (currentFile && currentFile.type === 'image') {
      activeModel = 'qwen/qwen3.6-27b';
      userContentPayload = [
        { type: 'text', text: fullPrompt || 'Analyze this image.' },
        { type: 'image_url', image_url: { url: currentFile.data } }
      ];
    }

    const apiMessages = [
      { role: 'system', content: systemInstruction },
      ...log.slice(0, -1).map(m => ({ role: m.role, content: m.content })),
      { role: 'user', content: userContentPayload }
    ];

    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: activeModel,
          messages: apiMessages,
          temperature: 0.7
        })
      });
      
      const data = await res.json();
      hideTyping();
      
      if (!res.ok || !data.choices?.[0]) {
        renderMessage('ai', '⚠ Error: ' + (data.error?.message || 'Connection failed. Check API key.'), false);
        log.pop();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
      } else {
        const replyText = data.choices[0].message.content;
        renderMessage('ai', replyText, true);
      }
    } catch (err) {
      hideTyping();
      renderMessage('ai', '⚠ Local Error: ' + err.message, false);
      log.pop();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
    }

    btn.disabled = false;
    inp.focus();
  }

  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 140) + 'px';
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  btn.addEventListener('click', send);

  document.getElementById('clear-btn').addEventListener('click', () => {
    if(confirm("Wipe chat history?")) {
      log = [];
      localStorage.removeItem(STORAGE_KEY);
      initChat();
    }
  });

  initChat();
</script>
</body>
</html>
