<!DOCTYPE html>
<html lang="en" data-theme="original">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeuralWeave — AstroFlux</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root[data-theme="original"] {
      --bg:      #000;
      --surface: #080808;
      --border:  #1c1c1c;
      --dim:     #333;
      --muted:   #4a4a4a;
      --text:    #e6e6e6;
      --sub:     #303030;
      --dot:     #00ff66;
    }
    :root[data-theme="cyberpunk"] {
      --bg:      #05050a;
      --surface: #0e0e1a;
      --border:  #ff005533;
      --dim:     #ff005566;
      --muted:   #8a8ab0;
      --text:    #00ffff;
      --sub:     #ff005544;
      --dot:     #ff0055;
    }
    :root[data-theme="emerald"] {
      --bg:      #020804;
      --surface: #06140a;
      --border:  #00ff6622;
      --dim:     #00ff6655;
      --muted:   #508060;
      --text:    #e0f8e8;
      --sub:     #00ff6633;
      --dot:     #00ff66;
    }
    :root[data-theme="solar"] {
      --bg:      #0a0602;
      --surface: #140d06;
      --border:  #ffaa0033;
      --dim:     #ffaa0066;
      --muted:   #907040;
      --text:    #ffe8cc;
      --sub:     #ffaa0033;
      --dot:     #ffaa00;
    }
    :root[data-theme="ocean"] {
      --bg:      #020408;
      --surface: #060c14;
      --border:  #0088ff33;
      --dim:     #0088ff66;
      --muted:   #407090;
      --text:    #e0f0ff;
      --sub:     #0088ff33;
      --dot:     #00aaff;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; transition: background 0.3s, color 0.3s; }

    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
      padding: 0 20px;
      position: relative;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .logo-group { display: flex; align-items: center; gap: 12px; }
    .logo-mark {
      width: 34px; height: 34px; border-radius: 6px;
      border: 1px solid var(--dim); display: grid; place-items: center;
    }
    .logo-mark svg { width: 18px; height: 18px; stroke: var(--text); }

    .brand { font-family: 'Syne', sans-serif; }
    .brand-co  { font-size: .6rem; font-weight: 700; color: var(--muted); letter-spacing: .22em; text-transform: uppercase; }
    .brand-ai  { font-size: 1.08rem; font-weight: 800; color: var(--text); letter-spacing: -.02em; line-height: 1.1; }

    .controls { display: flex; gap: 10px; align-items: center; }
    .theme-select {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      font-family: 'DM Mono', monospace; font-size: .65rem; padding: 5px 8px;
      border-radius: 5px; outline: none; cursor: pointer; transition: border-color .2s, color .2s;
    }
    .theme-select:hover { border-color: var(--dim); color: var(--text); }

    .icon-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      transition: color .2s; display: grid; place-items: center;
    }
    .icon-btn:hover { color: var(--text); }
    .icon-btn svg { width: 18px; height: 18px; }

    .status { display: flex; align-items: center; gap: 6px; font-size: .64rem; color: var(--muted); letter-spacing: .08em; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--dot);
      box-shadow: 0 0 8px var(--dot);
    }

    #messages {
      overflow-y: auto; padding: 30px 0;
      display: flex; flex-direction: column; gap: 22px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg { display: flex; gap: 11px; animation: rise .28s ease both; position: relative; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .msg.user { flex-direction: row-reverse; }

    .av {
      width: 27px; height: 27px; border-radius: 5px; flex-shrink: 0;
      display: grid; place-items: center;
      font-family: 'Syne', sans-serif; font-size: .58rem; font-weight: 800; letter-spacing: .03em;
      background: var(--surface); border: 1px solid var(--border);
    }
    .av.ai  { color: var(--text); border-color: var(--dim); }
    .av.usr { color: var(--muted); }

    .bub {
      max-width: 85%; padding: 12px 16px; border-radius: 10px;
      font-size: .85rem; line-height: 1.6; word-wrap: break-word;
    }
    .msg.ai   .bub { background: var(--surface); border: 1px solid var(--border); border-radius: 3px 10px 10px 10px; position: relative; }
    .msg.user .bub { background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 10px 3px 10px 10px; opacity: 0.95; }

    .bub pre { background: var(--bg); padding: 10px; border-radius: 6px; border: 1px solid var(--border); overflow-x: auto; margin: 8px 0; font-size: 0.75rem;}
    .bub code { background: var(--bg); padding: 2px 4px; border-radius: 4px; font-family: monospace; font-size: 0.8rem;}
    .bub pre code { background: none; padding: 0; }
    .bub p { margin-bottom: 8px; }
    .bub p:last-child { margin-bottom: 0; }

    /* Attached image display inside chat */
    .chat-img { max-width: 200px; max-height: 200px; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 8px; display: block; object-fit: cover; }

    /* Interactive Quiz Styling */
    .quiz-container { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin: 10px 0; }
    .quiz-question { font-weight: bold; margin-bottom: 10px; color: var(--text); font-size: .9rem; }
    .quiz-options { display: flex; flex-direction: column; gap: 6px; }
    .quiz-opt-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 6px; text-align: left; cursor: pointer;
      font-family: 'DM Mono', monospace; font-size: .8rem; transition: all 0.2s;
    }
    .quiz-opt-btn:hover:not(:disabled) { border-color: var(--dim); background: var(--border); }
    .quiz-opt-btn.correct { background: rgba(0, 255, 102, 0.15) !important; border-color: #00ff66 !important; color: #00ff66 !important; }
    .quiz-opt-btn.incorrect { background: rgba(255, 0, 85, 0.15) !important; border-color: #ff0055 !important; color: #ff0055 !important; }

    .copy-btn {
      position: absolute; top: 8px; right: 8px; background: var(--bg); border: 1px solid var(--border);
      color: var(--muted); border-radius: 4px; width: 22px; height: 22px; cursor: pointer;
      display: grid; place-items: center; opacity: 0; transition: opacity 0.2s;
    }
    .msg.ai:hover .copy-btn { opacity: 1; }
    .copy-btn:hover { color: var(--text); border-color: var(--dim); }
    .copy-btn svg { width: 12px; height: 12px; }

    .dots { display: flex; gap: 4px; align-items: center; padding: 3px 0; }
    .dots span {
      width: 5px; height: 5px; border-radius: 50%; background: var(--dim);
      animation: blink 1.4s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: .22s; }
    .dots span:nth-child(3) { animation-delay: .44s; }
    @keyframes blink { 0%,80%,100% { opacity: .12; } 40% { opacity: .7; } }

    #bar { padding: 15px 0 26px; border-top: 1px solid var(--border); }
    
    /* Attachment preview panel above text bar */
    #attachment-preview {
      display: none; align-items: center; gap: 8px; padding: 6px 10px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
      margin-bottom: 8px; font-size: .75rem; color: var(--muted);
    }
    #attachment-preview img { width: 32px; height: 32px; object-fit: cover; border-radius: 4px; }
    #remove-attachment { background: none; border: none; color: #ff0055; cursor: pointer; font-weight: bold; margin-left: auto; }

    .row { display: flex; gap: 8px; align-items: flex-end; }

    #inp {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 14px;
      font-family: 'DM Mono', monospace; font-size: .8rem; color: var(--text);
      resize: none; outline: none; transition: border-color .15s;
      min-height: 44px; max-height: 120px;
    }
    #inp:focus { border-color: var(--dim); }
    #inp::placeholder { color: var(--sub); }

    .action-btn {
      width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0;
      background: var(--surface); border: 1px solid var(--border);
      cursor: pointer; display: grid; place-items: center;
      transition: border-color .15s, background .15s; color: var(--muted);
    }
    .action-btn:hover { border-color: var(--dim); color: var(--text); }
    .action-btn svg { width: 16px; height: 16px; stroke: currentColor; }

    #btn { border-color: var(--dim); background: var(--surface); }
    #btn:hover:not(:disabled) { border-color: var(--text); }
    #btn:disabled { opacity: .2; cursor: not-allowed; }
    #btn svg { stroke: var(--text); }

    .foot { font-size: .6rem; color: var(--sub); margin-top: 9px; text-align: center; letter-spacing: .07em; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo-group">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand">
        <div class="brand-co">AstroFlux</div>
        <div class="brand-ai">NeuralWeave</div>
      </div>
    </div>
    
    <div class="controls">
      <select id="theme-select" class="theme-select" title="Select Color Theme">
        <option value="original">Original Dark</option>
        <option value="cyberpunk">Cyberpunk Neon</option>
        <option value="emerald">Emerald Matrix</option>
        <option value="solar">Solar Flare</option>
        <option value="ocean">Deep Ocean</option>
      </select>
      <div class="status"><div class="dot"></div><span>ONLINE</span></div>
      <button class="icon-btn" id="clear-btn" title="Clear Chat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
        </svg>
      </button>
    </div>
  </header>

  <div id="messages"></div>

  <div id="bar">
    <div id="attachment-preview">
      <img id="preview-thumb" src="" alt="preview"/>
      <span id="preview-name">File attached</span>
      <button id="remove-attachment" title="Remove">×</button>
    </div>
    <div class="row">
      <input type="file" id="file-inp" style="display: none;" accept="image/*,.txt,.md,.js,.json,.html,.css"/>
      <button class="action-btn" id="file-btn" title="Attach Image or File">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <textarea id="inp" rows="1" placeholder="Message NeuralWeave or ask for a quiz…"></textarea>
      <button class="action-btn" id="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="foot">NeuralWeave · AstroFlux © 2026 · Powered by Groq</div>
  </div>

</div>

<script>
  // ==========================================
  // PASTE YOUR GROQ API KEY INSIDE THE QUOTES:
  const apiKey = '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';
  // ==========================================

  const STORAGE_KEY = 'astroflux_groq_history';
  const THEME_KEY = 'astroflux_theme';
  let log = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  let attachedFile = null; // Stores file data (base64 or text)

  const feed = document.getElementById('messages');
  const inp  = document.getElementById('inp');
  const btn  = document.getElementById('btn');
  const fileBtn = document.getElementById('file-btn');
  const fileInp = document.getElementById('file-inp');
  const preview = document.getElementById('attachment-preview');
  const previewThumb = document.getElementById('preview-thumb');
  const previewName = document.getElementById('preview-name');
  const removeAttachment = document.getElementById('remove-attachment');
  const themeSelect = document.getElementById('theme-select');

  // Theme Management
  const savedTheme = localStorage.getItem(THEME_KEY) || 'original';
  document.documentElement.setAttribute('data-theme', savedTheme);
  themeSelect.value = savedTheme;

  themeSelect.addEventListener('change', (e) => {
    const chosenTheme = e.target.value;
    document.documentElement.setAttribute('data-theme', chosenTheme);
    localStorage.setItem(THEME_KEY, chosenTheme);
  });

  // File Handling
  fileBtn.addEventListener('click', () => fileInp.click());

  fileInp.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    if (file.type.startsWith('image/')) {
      reader.onload = (uploadEvent) => {
        attachedFile = { type: 'image', data: uploadEvent.target.result, name: file.name };
        previewThumb.src = uploadEvent.target.result;
        previewThumb.style.display = 'block';
        previewName.textContent = file.name;
        preview.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = (uploadEvent) => {
        attachedFile = { type: 'text', data: uploadEvent.target.result, name: file.name };
        previewThumb.style.display = 'none';
        previewName.textContent = '📄 ' + file.name;
        preview.style.display = 'flex';
      };
      reader.readAsText(file);
    }
  });

  removeAttachment.addEventListener('click', () => {
    attachedFile = null;
    fileInp.value = '';
    preview.style.display = 'none';
  });

  function parseMarkdown(text) {
    let html = text
      .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^\*]+)\*/g, '<em>$1</em>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    return `<p>${html}</p>`;
  }

  // Quiz Parser: Detects JSON quiz blocks or structured quiz text and renders interactive selectors
  function renderQuizWidgets(container, text) {
    // Look for JSON code blocks containing quiz formats
    const jsonMatch = text.match(/```json([\s\S]*?)```/) || text.match(/```([\s\S]*?)```/);
    if (!jsonMatch) {
      container.innerHTML = parseMarkdown(text);
      return;
    }

    try {
      let parsed = JSON.parse(jsonMatch[1].trim());
      if (!Array.isArray(parsed)) parsed = [parsed];

      if (parsed[0] && parsed[0].question && parsed[0].options) {
        container.innerHTML = parseMarkdown(text.replace(jsonMatch[0], '')); // render text outside block
        
        parsed.forEach((q, qIndex) => {
          const quizDiv = document.createElement('div');
          quizDiv.className = 'quiz-container';
          
          let optionsHtml = '';
          q.options.forEach((opt, oIndex) => {
            optionsHtml += `<button class="quiz-opt-btn" data-correct="${oIndex === q.correct}" onclick="handleQuizAnswer(this, ${q.correct}, ${oIndex})">${opt}</button>`;
          });

          quizDiv.innerHTML = `
            <div class="quiz-question">Q${qIndex + 1}: ${q.question}</div>
            <div class="quiz-options">${optionsHtml}</div>
          `;
          container.appendChild(quizDiv);
        });
        return;
      }
    } catch (e) {
      // Fallback if not valid quiz JSON
    }
    container.innerHTML = parseMarkdown(text);
  }

  window.handleQuizAnswer = function(btnElement, correctIndex, chosenIndex) {
    const parent = btnElement.parentElement;
    const buttons = parent.querySelectorAll('.quiz-opt-btn');
    
    buttons.forEach((btn, idx) => {
      btn.disabled = true;
      if (idx === correctIndex) btn.classList.add('correct');
      if (idx === chosenIndex && idx !== correctIndex) btn.classList.add('incorrect');
    });
  };

  function initChat() {
    feed.innerHTML = '';
    if (log.length === 0) {
      renderMessage('ai', "NeuralWeave initialized.\n\nTip: You can attach images/files, or prompt me to create interactive quizzes (e.g., 'Make a quiz about history')!", false);
    } else {
      log.forEach(msg => {
        if (msg.role !== 'system') {
          let content = typeof msg.content === 'string' ? msg.content : msg.content.find(c => c.type === 'text')?.text || '';
          renderMessage(msg.role === 'user' ? 'user' : 'ai', content, false, null);
        }
      });
    }
  }

  function renderMessage(role, text, save = true, fileObj = null) {
    const w = document.createElement('div');
    w.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    
    const a = document.createElement('div');
    a.className = 'av ' + (role === 'user' ? 'usr' : 'ai');
    a.textContent = role === 'user' ? 'YOU' : 'NW';
    
    const b = document.createElement('div');
    b.className = 'bub';
    
    if (role === 'user') {
      if (fileObj && fileObj.type === 'image') {
        const img = document.createElement('img');
        img.src = fileObj.data;
        img.className = 'chat-img';
        b.appendChild(img);
      }
      const txtSpan = document.createElement('span');
      txtSpan.textContent = text;
      b.appendChild(txtSpan);
    } else {
      renderQuizWidgets(b, text);
      const copyBtn = document.createElement('button');
      copyBtn.className = 'copy-btn';
      copyBtn.title = 'Copy text';
      copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
      copyBtn.onclick = () => {
        navigator.clipboard.writeText(text);
        copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#00ff66" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
        setTimeout(() => {
          copyBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`;
        }, 2000);
      };
      w.appendChild(copyBtn);
    }
    
    w.append(a, b);
    feed.append(w);
    feed.scrollTop = feed.scrollHeight;

    if (save) {
      log.push({ role: role === 'user' ? 'user' : 'assistant', content: text });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
    }
  }

  function showTyping() {
    const w = document.createElement('div');
    w.className = 'msg ai'; w.id = 'typing';
    const a = document.createElement('div');
    a.className = 'av ai'; a.textContent = 'NW';
    const b = document.createElement('div');
    b.className = 'bub';
    b.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    w.append(a, b);
    feed.append(w);
    feed.scrollTop = feed.scrollHeight;
  }

  function hideTyping() { document.getElementById('typing')?.remove(); }

  async function send() {
    let text = inp.value.trim();
    if (!text && !attachedFile) return;

    // If a text file was attached, append its content to the user message context
    let fullPrompt = text;
    if (attachedFile && attachedFile.type === 'text') {
      fullPrompt += `\n\n[Attached File: ${attachedFile.name}]\n${attachedFile.data}`;
    }

    // Force system instruction to output JSON format when quiz is requested
    let systemInstruction = 'You are NeuralWeave, an advanced AI assistant built by AstroFlux. When the user requests a quiz, format your response as a JSON code block like this: ```json[{"question": "...", "options": ["A", "B", "C", "D"], "correct": 0}]``` where correct is the index (0-3) of the right option.';

    inp.value = ''; 
    inp.style.height = 'auto';
    btn.disabled = true;

    let currentFile = attachedFile;
    renderMessage('user', text || `[Attached: ${currentFile.name}]`, true, currentFile);

    // Reset attachments
    attachedFile = null;
    preview.style.display = 'none';
    fileInp.value = '';

    showTyping();

    // Prepare message payload supporting Vision (`qwen/qwen3.6-27b`) if an image is attached
    let userContentPayload = fullPrompt;
    let activeModel = 'openai/gpt-oss-20b';

    if (currentFile && currentFile.type === 'image') {
      activeModel = 'qwen/qwen3.6-27b'; // Groq vision model
      userContentPayload = [
        { type: 'text', text: fullPrompt || 'Analyze this image.' },
        { type: 'image_url', image_url: { url: currentFile.data } }
      ];
    }

    const apiMessages = [
      { role: 'system', content: systemInstruction },
      ...log.slice(0, -1).map(m => ({ role: m.role, content: m.content })),
      { role: 'user', content: userContentPayload }
    ];

    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey
        },
        body: JSON.stringify({
          model: activeModel,
          messages: apiMessages,
          temperature: 0.7
        })
      });
      
      const data = await res.json();
      hideTyping();
      
      if (!res.ok || !data.choices?.[0]) {
        renderMessage('ai', '⚠ Error: ' + (data.error?.message || 'Connection failed. Check API key.'), false);
        log.pop();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
      } else {
        const replyText = data.choices[0].message.content;
        renderMessage('ai', replyText, true);
      }
    } catch (err) {
      hideTyping();
      renderMessage('ai', '⚠ Local Error: ' + err.message, false);
      log.pop();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(log));
    }

    btn.disabled = false;
    inp.focus();
  }

  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  btn.addEventListener('click', send);

  document.getElementById('clear-btn').addEventListener('click', () => {
    if(confirm("Wipe neural pathways (Clear chat history)?")) {
      log = [];
      localStorage.removeItem(STORAGE_KEY);
      initChat();
    }
  });

  initChat();
</script>
</body>
</html>
