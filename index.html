<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeuralWeave — AstroFlux</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #04070f;
      --surface:   #080e1c;
      --border:    #12213a;
      --accent:    #00e5ff;
      --accent2:   #7b61ff;
      --text:      #dce8f5;
      --muted:     #5a7a99;
      --user-bg:   #0d1f38;
      --ai-bg:     #060d1a;
      --glow:      0 0 28px rgba(0,229,255,.18);
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }

    /* ── noise overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
      opacity: .4;
    }

    /* ── grid lines ── */
    body::after {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: .35;
    }

    #app {
      position: relative; z-index: 1;
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── header ── */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 20px 0 16px;
      border-bottom: 1px solid var(--border);
    }
    .logo-group { display: flex; align-items: center; gap: 14px; }
    .logo-mark {
      width: 38px; height: 38px;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      display: grid; place-items: center;
      box-shadow: var(--glow);
      position: relative; overflow: hidden;
    }
    .logo-mark svg { width: 22px; height: 22px; }
    .logo-mark::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(0,229,255,.12), transparent 60%);
    }
    .brand { font-family: 'Syne', sans-serif; }
    .brand-name { font-size: .68rem; font-weight: 600; color: var(--muted); letter-spacing: .18em; text-transform: uppercase; }
    .brand-ai   { font-size: 1.18rem; font-weight: 800; color: var(--text); letter-spacing: -.01em; line-height: 1.1; }
    .brand-ai span { color: var(--accent); }

    .status-pill {
      display: flex; align-items: center; gap: 7px;
      font-size: .7rem; color: var(--muted); letter-spacing: .06em;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #1aff8a;
      box-shadow: 0 0 8px #1aff8a;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* ── messages ── */
    #messages {
      overflow-y: auto; padding: 28px 0; display: flex; flex-direction: column; gap: 20px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }

    .msg { display: flex; gap: 12px; animation: fadeUp .35s ease both; }
    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:none} }

    .msg.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px; height: 32px; border-radius: 7px; flex-shrink: 0;
      display: grid; place-items: center; font-size: .7rem; font-weight: 700;
      font-family: 'Syne', sans-serif;
    }
    .avatar.ai  { background: linear-gradient(135deg, #0a1e38, #112); border: 1px solid var(--accent); color: var(--accent); box-shadow: var(--glow); }
    .avatar.usr { background: var(--user-bg); border: 1px solid var(--border); color: var(--muted); }

    .bubble {
      max-width: 72%; padding: 13px 16px; border-radius: 12px;
      font-size: .83rem; line-height: 1.7; letter-spacing: .01em;
    }
    .msg.user  .bubble { background: var(--user-bg); border: 1px solid var(--border); color: var(--text); border-radius: 12px 4px 12px 12px; }
    .msg.ai    .bubble { background: var(--ai-bg);   border: 1px solid var(--border); color: var(--text); border-radius: 4px 12px 12px 12px; }

    /* typing indicator */
    .typing-dots { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
    .typing-dots span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); opacity: .5;
      animation: blink 1.2s ease-in-out infinite;
    }
    .typing-dots span:nth-child(2){animation-delay:.2s}
    .typing-dots span:nth-child(3){animation-delay:.4s}
    @keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

    /* ── input bar ── */
    #input-area {
      padding: 16px 0 24px;
      border-top: 1px solid var(--border);
    }
    .chat-row { display: flex; gap: 10px; }
    #user-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px;
      font-family: 'DM Mono', monospace; font-size: .83rem; color: var(--text);
      resize: none; outline: none; transition: border .2s, box-shadow .2s;
      min-height: 48px; max-height: 140px;
    }
    #user-input:focus { border-color: var(--accent); box-shadow: var(--glow); }
    #user-input::placeholder { color: #2a4060; }

    #send-btn {
      width: 48px; height: 48px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      border: none; cursor: pointer; display: grid; place-items: center;
      transition: opacity .2s, transform .15s, box-shadow .2s;
      box-shadow: 0 0 18px rgba(0,229,255,.25);
    }
    #send-btn:hover  { opacity: .9; transform: scale(1.05); }
    #send-btn:active { transform: scale(.96); }
    #send-btn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    #send-btn svg { width: 18px; height: 18px; }

    .hint { font-size: .66rem; color: #243550; margin-top: 8px; text-align: center; letter-spacing: .04em; }

    /* scrollbar */
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo-group">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#00e5ff" stroke-width="1.6" stroke-linecap="round">
          <path d="M12 2 L2 7 L12 12 L22 7 Z"/>
          <path d="M2 17 L12 22 L22 17"/>
          <path d="M2 12 L12 17 L22 12"/>
        </svg>
      </div>
      <div class="brand">
        <div class="brand-name">AstroFlux</div>
        <div class="brand-ai">Neural<span>Weave</span></div>
      </div>
    </div>
    <div class="status-pill">
      <div class="status-dot"></div>
      ONLINE
    </div>
  </header>

  <div id="messages">
    <div class="msg ai">
      <div class="avatar ai">NW</div>
      <div class="bubble">
        Initialising NeuralWeave intelligence layer — AstroFlux systems nominal.<br><br>
        How can I assist you today?
      </div>
    </div>
  </div>

  <div id="input-area">
    <div class="chat-row">
      <textarea id="user-input" rows="1" placeholder="Send a message…"></textarea>
      <button id="send-btn" title="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="hint">NeuralWeave · Powered by Claude · AstroFlux © 2026</div>
  </div>

</div>

<script>
  const API_KEY = 'YOUR_API_KEY_HERE'; // 🔑 Replace with your Anthropic API key

  const messagesEl = document.getElementById('messages');
  const inputEl    = document.getElementById('user-input');
  const sendBtn    = document.getElementById('send-btn');

  const history = [];

  // auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
  sendBtn.addEventListener('click', sendMessage);

  function appendMessage(role, content) {
    const div = document.createElement('div');
    div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
    const avatar = document.createElement('div');
    avatar.className = `avatar ${role === 'user' ? 'usr' : 'ai'}`;
    avatar.textContent = role === 'user' ? 'YOU' : 'NW';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = content.replace(/\n/g, '<br>');
    div.appendChild(avatar);
    div.appendChild(bubble);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'msg ai'; div.id = 'typing';
    const avatar = document.createElement('div');
    avatar.className = 'avatar ai'; avatar.textContent = 'NW';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
    div.appendChild(avatar); div.appendChild(bubble);
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const el = document.getElementById('typing');
    if (el) el.remove();
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = ''; inputEl.style.height = 'auto';
    sendBtn.disabled = true;

    appendMessage('user', text);
    history.push({ role: 'user', content: text });

    showTyping();

    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': API_KEY,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1024,
          system: "You are NeuralWeave, an advanced AI assistant built by AstroFlux. You are precise, insightful, and professional with a subtle futuristic tone. Always be helpful and concise.",
          messages: history
        })
      });

      const data = await res.json();
      removeTyping();

      if (data.error) {
        appendMessage('ai', `⚠ API Error: ${data.error.message}`);
        history.pop();
      } else {
        const reply = data.content.map(b => b.text || '').join('');
        appendMessage('ai', reply);
        history.push({ role: 'assistant', content: reply });
      }
    } catch (err) {
      removeTyping();
      appendMessage('ai', `⚠ Network error: ${err.message}`);
      history.pop();
    }

    sendBtn.disabled = false;
    inputEl.focus();
  }
</script>
</body>
</html>
