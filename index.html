<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NeuralWeave — AstroFlux</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #000;
      --surface: #080808;
      --border:  #1c1c1c;
      --dim:     #333;
      --muted:   #4a4a4a;
      --text:    #e6e6e6;
      --sub:     #303030;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }

    #app {
      display: grid;
      grid-template-rows: auto 1fr auto;
      height: 100vh;
      max-width: 740px;
      margin: 0 auto;
      padding: 0 20px;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 22px 0 18px;
      border-bottom: 1px solid var(--border);
    }

    .logo-group { display: flex; align-items: center; gap: 12px; }

    .logo-mark {
      width: 34px; height: 34px; border-radius: 6px;
      border: 1px solid var(--dim);
      display: grid; place-items: center;
    }
    .logo-mark svg { width: 18px; height: 18px; }

    .brand { font-family: 'Syne', sans-serif; }
    .brand-co  { font-size: .6rem; font-weight: 700; color: var(--muted); letter-spacing: .22em; text-transform: uppercase; }
    .brand-ai  { font-size: 1.08rem; font-weight: 800; color: var(--text); letter-spacing: -.02em; line-height: 1.1; }

    .status { display: flex; align-items: center; gap: 6px; font-size: .64rem; color: var(--muted); letter-spacing: .08em; }
    .dot {
      width: 6px; height: 6px; border-radius: 50%; background: var(--dim);
      animation: breathe 3s ease-in-out infinite;
    }
    @keyframes breathe { 0%,100%{opacity:.4} 50%{opacity:1} }

    #messages {
      overflow-y: auto; padding: 30px 0;
      display: flex; flex-direction: column; gap: 22px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
    }
    #messages::-webkit-scrollbar { width: 3px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg { display: flex; gap: 11px; animation: rise .28s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
    .msg.user { flex-direction: row-reverse; }

    .av {
      width: 27px; height: 27px; border-radius: 5px; flex-shrink: 0;
      display: grid; place-items: center;
      font-family: 'Syne', sans-serif; font-size: .58rem; font-weight: 800; letter-spacing: .03em;
      background: var(--surface); border: 1px solid var(--border);
    }
    .av.ai  { color: var(--text); border-color: var(--dim); }
    .av.usr { color: var(--muted); }

    .bub {
      max-width: 75%; padding: 11px 14px; border-radius: 10px;
      font-size: .8rem; line-height: 1.78;
    }
    .msg.ai   .bub { background: var(--surface); border: 1px solid var(--border); border-radius: 3px 10px 10px 10px; }
    .msg.user .bub { background: #0b0b0b; border: 1px solid var(--border); color: #ccc; border-radius: 10px 3px 10px 10px; }

    .dots { display: flex; gap: 4px; align-items: center; padding: 3px 0; }
    .dots span {
      width: 5px; height: 5px; border-radius: 50%; background: var(--dim);
      animation: blink 1.4s ease-in-out infinite;
    }
    .dots span:nth-child(2) { animation-delay: .22s; }
    .dots span:nth-child(3) { animation-delay: .44s; }
    @keyframes blink { 0%,80%,100% { opacity: .12; } 40% { opacity: .7; } }

    #bar {
      padding: 15px 0 26px;
      border-top: 1px solid var(--border);
    }

    .row { display: flex; gap: 8px; }

    #inp {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 11px 14px;
      font-family: 'DM Mono', monospace; font-size: .8rem; color: var(--text);
      resize: none; outline: none; transition: border-color .15s;
      min-height: 44px; max-height: 120px;
    }
    #inp:focus { border-color: var(--dim); }
    #inp::placeholder { color: var(--sub); }

    #btn {
      width: 44px; height: 44px; border-radius: 8px; flex-shrink: 0;
      background: var(--surface); border: 1px solid var(--dim);
      cursor: pointer; display: grid; place-items: center;
      transition: border-color .15s, background .15s;
    }
    #btn:hover:not(:disabled) { background: #111; border-color: #666; }
    #btn:active:not(:disabled) { background: #0a0a0a; }
    #btn:disabled { opacity: .2; cursor: not-allowed; }
    #btn svg { width: 15px; height: 15px; }

    .foot { font-size: .6rem; color: var(--sub); margin-top: 9px; text-align: center; letter-spacing: .07em; }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo-group">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e6e6e6" stroke-width="1.5" stroke-linecap="round">
          <path d="M12 2L2 7l10 5 10-5z"/>
          <path d="M2 17l10 5 10-5"/>
          <path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div class="brand">
        <div class="brand-co">AstroFlux</div>
        <div class="brand-ai">NeuralWeave</div>
      </div>
    </div>
    <div class="status"><div class="dot"></div>ONLINE</div>
  </header>

  <div id="messages">
    <div class="msg ai">
      <div class="av ai">NW</div>
      <div class="bub">NeuralWeave online — AstroFlux systems nominal.<br><br>How can I assist you?</div>
    </div>
  </div>

  <div id="bar">
    <div class="row">
      <textarea id="inp" rows="1" placeholder="Message NeuralWeave…"></textarea>
      <button id="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="#e6e6e6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
    <div class="foot">NeuralWeave · AstroFlux © 2026</div>
  </div>

</div>
<script>
  const KEY = 'YOUR_MISTRAL_API_KEY_HERE';

  const feed = document.getElementById('messages');
  const inp  = document.getElementById('inp');
  const btn  = document.getElementById('btn');
  const log  = [];

  inp.addEventListener('input', () => {
    inp.style.height = 'auto';
    inp.style.height = Math.min(inp.scrollHeight, 120) + 'px';
  });

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  btn.addEventListener('click', send);

  function addMsg(role, text) {
    const w = document.createElement('div');
    w.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    const a = document.createElement('div');
    a.className = 'av ' + (role === 'user' ? 'usr' : 'ai');
    a.textContent = role === 'user' ? 'YOU' : 'NW';
    const b = document.createElement('div');
    b.className = 'bub';
    b.innerHTML = text.replace(/\n/g, '<br>');
    w.append(a, b);
    feed.append(w);
    feed.scrollTop = feed.scrollHeight;
  }

  function showTyping() {
    const w = document.createElement('div');
    w.className = 'msg ai'; w.id = 'typing';
    const a = document.createElement('div');
    a.className = 'av ai'; a.textContent = 'NW';
    const b = document.createElement('div');
    b.className = 'bub';
    b.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>';
    w.append(a, b);
    feed.append(w);
    feed.scrollTop = feed.scrollHeight;
  }

  function hideTyping() { document.getElementById('typing')?.remove(); }

  async function send() {
    const text = inp.value.trim();
    if (!text) return;
    inp.value = ''; inp.style.height = 'auto';
    btn.disabled = true;
    addMsg('user', text);
    log.push({ role: 'user', content: text });
    showTyping();

    try {
      const res = await fetch('https://api.mistral.ai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + KEY
        },
        body: JSON.stringify({
          model: 'mistral-large-latest',
          messages: [
            { role: 'system', content: 'You are NeuralWeave, an advanced AI assistant built by AstroFlux. Be precise, insightful, and professional with a subtle futuristic tone.' },
            ...log
          ]
        })
      });
      const data = await res.json();
      hideTyping();
      if (data.error) {
        addMsg('ai', '⚠ ' + data.error.message);
        log.pop();
      } else {
        const reply = data.choices[0].message.content;
        addMsg('ai', reply);
        log.push({ role: 'assistant', content: reply });
      }
    } catch (err) {
      hideTyping();
      addMsg('ai', '⚠ ' + err.message);
      log.pop();
    }

    btn.disabled = false;
    inp.focus();
  }
</script>
</body>
</html>
