<!DOCTYPE html>
<html lang="en" data-theme="original">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>NeuralWeave — AstroFlux AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    /* --- COLOR THEME PALETTES --- */
    :root[data-theme="original"] {
      --bg: #030508; --surface: #0a0f18; --panel: rgba(10, 15, 24, 0.75);
      --border: rgba(0, 255, 102, 0.15); --border-focus: rgba(0, 255, 102, 0.5);
      --muted: #6b7c93; --text: #f0f4f8; --accent: #00ff66; --accent-glow: rgba(0, 255, 102, 0.25);
    }
    :root[data-theme="cyberpunk"] {
      --bg: #07050d; --surface: #120e22; --panel: rgba(18, 14, 34, 0.75);
      --border: rgba(255, 0, 85, 0.25); --border-focus: rgba(255, 0, 85, 0.6);
      --muted: #8c7ea8; --text: #00ffff; --accent: #ff0055; --accent-glow: rgba(255, 0, 85, 0.3);
    }
    :root[data-theme="emerald"] {
      --bg: #020a06; --surface: #071910; --panel: rgba(7, 25, 16, 0.75);
      --border: rgba(0, 220, 100, 0.2); --border-focus: rgba(0, 220, 100, 0.5);
      --muted: #629075; --text: #e2fceb; --accent: #00dc64; --accent-glow: rgba(0, 220, 100, 0.25);
    }
    :root[data-theme="solar"] {
      --bg: #0d0803; --surface: #1b1207; --panel: rgba(27, 18, 7, 0.75);
      --border: rgba(255, 140, 0, 0.2); --border-focus: rgba(255, 140, 0, 0.5);
      --muted: #9c7c54; --text: #fff2e0; --accent: #ff8c00; --accent-glow: rgba(255, 140, 0, 0.25);
    }
    :root[data-theme="ocean"] {
      --bg: #030812; --surface: #0a1426; --panel: rgba(10, 20, 38, 0.75);
      --border: rgba(0, 136, 255, 0.2); --border-focus: rgba(0, 136, 255, 0.5);
      --muted: #5b82a8; --text: #e0f0ff; --accent: #0088ff; --accent-glow: rgba(0, 136, 255, 0.3);
    }
    :root[data-theme="violet"] {
      --bg: #08040d; --surface: #130920; --panel: rgba(19, 9, 32, 0.75);
      --border: rgba(175, 82, 255, 0.2); --border-focus: rgba(175, 82, 255, 0.5);
      --muted: #856a9e; --text: #f3e9ff; --accent: #af52ff; --accent-glow: rgba(175, 82, 255, 0.3);
    }
    :root[data-theme="crimson"] {
      --bg: #0c0204; --surface: #1c060a; --panel: rgba(28, 6, 10, 0.75);
      --border: rgba(255, 30, 60, 0.2); --border-focus: rgba(255, 30, 60, 0.5);
      --muted: #a3616d; --text: #ffe8ec; --accent: #ff1e3c; --accent-glow: rgba(255, 30, 60, 0.3);
    }

    html, body {
      height: 100vh; height: 100dvh;
      background: var(--bg); color: var(--text);
      font-family: 'Outfit', sans-serif; overflow: hidden;
      transition: background 0.4s ease, color 0.4s ease;
      position: fixed; width: 100%; top: 0; left: 0;
    }

    body::before {
      content: ''; position: absolute; top: -20%; left: -20%;
      width: 70vw; height: 70vw;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      opacity: 0.35; z-index: 0; pointer-events: none; filter: blur(60px);
    }

    #app-wrapper {
      display: flex; height: 100vh; height: 100dvh; width: 100vw;
      position: relative; z-index: 1; overflow: hidden;
    }

    /* --- MOBILE OVERLAY BACKDROP --- */
    #sidebar-backdrop {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
      z-index: 99;
    }
    #sidebar-backdrop.visible { opacity: 1; pointer-events: auto; }

    /* --- SIDEBAR CONTAINER --- */
    #sidebar {
      width: 300px; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 16px; gap: 14px;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); flex-shrink: 0; z-index: 100;
      height: 100%; overflow-y: auto;
    }

    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2px;
    }
    .sidebar-close-btn {
      display: none; background: none; border: none; color: var(--muted);
      cursor: pointer; padding: 4px; border-radius: 6px;
    }
    .sidebar-close-btn:hover { color: var(--text); }

    .sidebar-section-title {
      font-size: 0.65rem; font-weight: 700; color: var(--muted);
      letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 4px;
    }

    .sidebar-controls { display: flex; flex-direction: column; gap: 10px; }

    .select-field {
      background: var(--bg); border: 1px solid var(--border); color: var(--text);
      font-family: 'Outfit', sans-serif; font-size: 0.85rem; font-weight: 500;
      padding: 10px; border-radius: 8px; outline: none; cursor: pointer;
      width: 100%; transition: all 0.2s; -webkit-appearance: none;
    }
    .select-field:hover { border-color: var(--border-focus); }

    .new-chat-btn {
      background: var(--panel); border: 1px solid var(--border-focus); color: var(--accent);
      font-family: 'Outfit', sans-serif; font-size: 0.9rem; font-weight: 600;
      padding: 12px; border-radius: 10px; cursor: pointer; display: flex;
      align-items: center; justify-content: center; gap: 8px;
      transition: all 0.2s; box-shadow: 0 0 10px var(--accent-glow);
    }
    .new-chat-btn:hover { background: var(--accent); color: var(--bg); }

    #chat-list {
      flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
      min-height: 150px;
    }

    .chat-item {
      padding: 12px; border-radius: 8px; border: 1px solid transparent;
      background: transparent; color: var(--muted); font-size: 0.88rem;
      cursor: pointer; display: flex; align-items: center; justify-content: space-between;
      transition: all 0.2s; position: relative;
    }
    .chat-item:hover { background: var(--panel); color: var(--text); border-color: var(--border); }
    .chat-item.active { background: var(--panel); color: var(--text); border-color: var(--border-focus); font-weight: 600; }
    .chat-item-title { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; flex: 1; }
    
    .chat-item-actions { display: flex; gap: 6px; opacity: 0.8; }
    .chat-action-btn {
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 4px; display: grid; place-items: center; border-radius: 4px;
    }
    .chat-action-btn:hover { color: var(--text); }
    .chat-item.pinned .pin-icon { color: var(--accent); }

    /* --- MAIN CHAT AREA --- */
    #main-content {
      flex: 1; display: flex; flex-direction: column; height: 100%;
      position: relative; max-width: 950px; margin: 0 auto; width: 100%; padding: 0 16px;
    }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }

    .logo-group { display: flex; align-items: center; gap: 10px; }
    .logo-mark {
      width: 36px; height: 36px; border-radius: 10px;
      background: var(--surface); border: 1px solid var(--border);
      display: grid; place-items: center; box-shadow: 0 0 15px var(--accent-glow);
    }
    .logo-mark svg { width: 18px; height: 18px; stroke: var(--accent); }
    .brand-co { font-size: .6rem; font-weight: 600; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; }
    .brand-ai { font-size: 1.1rem; font-weight: 700; color: var(--text); letter-spacing: -.01em; }

    .header-actions { display: flex; gap: 10px; align-items: center; }
    .icon-btn {
      background: var(--surface); border: 1px solid var(--border); color: var(--muted);
      width: 40px; height: 40px; border-radius: 10px; cursor: pointer;
      display: grid; place-items: center; transition: all 0.2s;
    }
    .icon-btn:hover { color: var(--text); border-color: var(--border-focus); }
    .icon-btn svg { width: 20px; height: 20px; }

    .status { display: flex; align-items: center; gap: 6px; font-size: .7rem; font-weight: 500; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

    /* --- CHAT FEED & MESSAGES --- */
    #messages-wrapper { flex: 1; position: relative; overflow: hidden; display: flex; flex-direction: column; }
    
    #messages {
      flex: 1; overflow-y: auto; padding: 20px 0; display: flex;
      flex-direction: column; gap: 18px; scroll-behavior: smooth;
      scrollbar-width: thin; scrollbar-color: var(--border) transparent;
      -webkit-overflow-scrolling: touch;
    }

    .msg { display: flex; gap: 10px; animation: rise .3s cubic-bezier(0.16, 1, 0.3, 1) both; position: relative; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .msg.user { flex-direction: row-reverse; }

    .av {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: grid; place-items: center; font-size: .65rem; font-weight: 700;
      background: var(--surface); border: 1px solid var(--border);
    }
    .av.ai { color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
    .av.usr { color: var(--muted); }

    .bub {
      max-width: 86%; padding: 12px 16px; border-radius: 14px;
      font-size: .92rem; line-height: 1.55; word-wrap: break-word; position: relative;
    }
    .msg.ai .bub { 
      background: var(--panel); backdrop-filter: blur(12px); 
      border: 1px solid var(--border); border-radius: 4px 16px 16px 16px; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .msg.user .bub { 
      background: linear-gradient(135deg, var(--surface), rgba(255,255,255,0.03)); 
      border: 1px solid var(--border-focus); color: var(--text); 
      border-radius: 16px 4px 16px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }

    /* Code Snippet Styles & Copy Header */
    .code-block-wrapper { margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--bg); }
    .code-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 6px 12px; background: var(--surface); border-bottom: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--muted);
    }
    .code-copy-btn {
      background: transparent; border: 1px solid var(--border); color: var(--muted);
      padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 0.7rem;
      transition: all 0.2s;
    }
    .code-copy-btn:hover { color: var(--accent); border-color: var(--accent); }
    .bub pre { padding: 12px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; margin: 0; }
    .bub code { background: var(--bg); padding: 2px 6px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; color: var(--accent); }
    .bub pre code { background: none; padding: 0; color: var(--text); }
    .bub p { margin-bottom: 8px; }
    .bub p:last-child { margin-bottom: 0; }

    .chat-img { max-width: 100%; width: 280px; border-radius: 8px; border: 1px solid var(--border); margin: 6px 0; display: block; object-fit: cover; }

    /* Floating Scroll-to-Bottom Button */
    #scroll-pill {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(50px);
      background: var(--surface); border: 1px solid var(--border-focus); color: var(--accent);
      padding: 8px 16px; border-radius: 20px; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 15px var(--accent-glow);
      opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; align-items: center; gap: 6px; z-index: 5;
    }
    #scroll-pill.visible { opacity: 1; pointer-events: auto; transform: translateX(-50%) translateY(0); }

    /* --- INPUT BAR --- */
    #bar { padding: 10px 0 calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--border); flex-shrink: 0; }
    
    #attachment-preview {
      display: none; align-items: center; gap: 10px; padding: 8px 12px;
      background: var(--surface); border: 1px solid var(--border-focus); border-radius: 8px;
      margin-bottom: 8px; font-size: .8rem; color: var(--muted);
    }
    #attachment-preview img { width: 36px; height: 36px; object-fit: cover; border-radius: 6px; }
    #remove-attachment { background: none; border: none; color: var(--accent); cursor: pointer; font-weight: bold; margin-left: auto; }

    .row { display: flex; gap: 8px; align-items: flex-end; }

    #inp {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; font-family: 'Outfit', sans-serif;
      font-size: 16px; /* 16px prevents automatic zoom on iOS Safari */
      color: var(--text); resize: none; outline: none; transition: all 0.2s;
      min-height: 46px; max-height: 120px; box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
    }
    #inp:focus { border-color: var(--border-focus); box-shadow: 0 0 15px var(--accent-glow), inset 0 2px 6px rgba(0,0,0,0.2); }
    #inp::placeholder { color: var(--muted); opacity: 0.8; font-size: 0.88rem; }

    .action-btn {
      width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
      background: var(--surface); border: 1px solid var(--border);
      cursor: pointer; display: grid; place-items: center; transition: all 0.2s; color: var(--muted);
    }
    .action-btn:hover { border-color: var(--border-focus); color: var(--text); }
    
    #btn { border-color: var(--border-focus); background: var(--surface); color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }
    #btn:hover:not(:disabled) { background: var(--accent); color: var(--bg); border-color: var(--accent); }
    #btn:disabled { opacity: .3; cursor: not-allowed; box-shadow: none; }

    .foot { font-size: .62rem; color: var(--muted); margin-top: 8px; text-align: center; letter-spacing: .05em; opacity: 0.8; }

    /* MOBILE-SPECIFIC ADJUSTMENTS */
    @media (max-width: 768px) {
      #sidebar { position: fixed; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
      .sidebar-close-btn { display: block; }
      .status { display: none; }
      .bub { max-width: 90%; }
      #main-content { padding: 0 12px; }
    }
  </style>
</head>
<body>
<div id="app-wrapper">

  <!-- BACKDROP OVERLAY FOR MOBILE SIDEBAR -->
  <div id="sidebar-backdrop"></div>

  <!-- SIDEBAR PANEL -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <button class="new-chat-btn" id="new-chat-btn" style="flex: 1; margin-right: 8px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        + New Chat
      </button>
      <button class="sidebar-close-btn" id="sidebar-close-btn" title="Close Sidebar">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
    </div>

    <div class="sidebar-controls">
      <div class="sidebar-section-title">Theme Aesthetics</div>
      <select id="theme-select" class="select-field">
        <option value="original">Neon Green</option>
        <option value="cyberpunk">Cyberpunk Pink</option>
        <option value="emerald">Emerald Matrix</option>
        <option value="solar">Solar Amber</option>
        <option value="ocean">Ocean Blue</option>
        <option value="violet">Neon Violet</option>
        <option value="crimson">Crimson Cyber</option>
      </select>

      <div class="sidebar-section-title">AI Neural Engine</div>
      <select id="model-select" class="select-field">
        <option value="flash">Neural-Flash-1.1 (Quick & Short)</option>
        <option value="pro" selected>Neural-Pro-1.1 (Detailed)</option>
        <option value="max">Neural-Max-1.2 (Long & Deep)</option>
      </select>

      <div class="sidebar-section-title">Persona / Mode</div>
      <select id="persona-select" class="select-field">
        <option value="casual" selected>Casual Assistant</option>
        <option value="professional">Professional</option>
        <option value="educational">Educational Tutor</option>
        <option value="formal">Formal Expert</option>
        <option value="code">Code Agent</option>
      </select>
    </div>

    <div class="sidebar-section-title" style="margin-top: 6px;">Saved Chats</div>
    <div id="chat-list"></div>
  </aside>

  <!-- MAIN CHAT INTERFACE -->
  <main id="main-content">
    <header>
      <div class="logo-group">
        <button class="icon-btn" id="toggle-sidebar" title="Toggle Sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="logo-mark">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M12 2L2 7l10 5 10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
        </div>
        <div class="brand">
          <div class="brand-co">AstroFlux</div>
          <div class="brand-ai">NeuralWeave</div>
        </div>
      </div>
      
      <div class="header-actions">
        <div class="status"><div class="dot"></div><span>ONLINE</span></div>
      </div>
    </header>

    <div id="messages-wrapper">
      <div id="messages"></div>
      <button id="scroll-pill">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
        New Messages
      </button>
    </div>

    <div id="bar">
      <div id="attachment-preview">
        <img id="preview-thumb" src="" alt="preview"/>
        <span id="preview-name">File attached</span>
        <button id="remove-attachment" title="Remove">×</button>
      </div>
      <div class="row">
        <input type="file" id="file-inp" style="display: none;" accept="image/*,.txt,.md,.js,.json,.html,.css"/>
        <button class="action-btn" id="file-btn" title="Attach File">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        </button>
        <textarea id="inp" rows="1" placeholder="Ask NeuralWeave, type /image..."></textarea>
        <button class="action-btn" id="btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
      <div class="foot">NeuralWeave · AstroFlux AI © 2026 · Powered by Groq</div>
    </div>
  </main>

</div>

<script>
  // ==========================================
  // PASTE YOUR GROQ API KEY INSIDE THE QUOTES:
  const apiKey = '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';
  // ==========================================

  const CHATS_STORAGE_KEY = 'nw_multi_chats';
  const SETTINGS_KEY = 'nw_settings';

  let chats = JSON.parse(localStorage.getItem(CHATS_STORAGE_KEY)) || [];
  let currentChatId = null;
  let attachedFile = null;

  // UI Elements
  const sidebar = document.getElementById('sidebar');
  const sidebarBackdrop = document.getElementById('sidebar-backdrop');
  const sidebarCloseBtn = document.getElementById('sidebar-close-btn');
  const chatList = document.getElementById('chat-list');
  const feed = document.getElementById('messages');
  const scrollPill = document.getElementById('scroll-pill');
  const inp = document.getElementById('inp');
  const btn = document.getElementById('btn');
  const fileBtn = document.getElementById('file-btn');
  const fileInp = document.getElementById('file-inp');
  const preview = document.getElementById('attachment-preview');
  const previewThumb = document.getElementById('preview-thumb');
  const previewName = document.getElementById('preview-name');
  const themeSelect = document.getElementById('theme-select');
  const modelSelect = document.getElementById('model-select');
  const personaSelect = document.getElementById('persona-select');

  // Sidebar Controls
  function openSidebar() {
    sidebar.classList.add('open');
    sidebarBackdrop.classList.add('visible');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    sidebarBackdrop.classList.remove('visible');
  }

  document.getElementById('toggle-sidebar').onclick = openSidebar;
  sidebarCloseBtn.onclick = closeSidebar;
  sidebarBackdrop.onclick = closeSidebar;

  // Load Settings
  const settings = JSON.parse(localStorage.getItem(SETTINGS_KEY)) || { theme: 'original', model: 'pro', persona: 'casual' };
  document.documentElement.setAttribute('data-theme', settings.theme);
  themeSelect.value = settings.theme;
  modelSelect.value = settings.model;
  personaSelect.value = settings.persona;

  themeSelect.addEventListener('change', (e) => {
    document.documentElement.setAttribute('data-theme', e.target.value);
    saveSettings();
  });
  modelSelect.addEventListener('change', saveSettings);
  personaSelect.addEventListener('change', saveSettings);

  function saveSettings() {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      theme: themeSelect.value,
      model: modelSelect.value,
      persona: personaSelect.value
    }));
  }

  // Auto-scroll pill visibility tracker
  feed.addEventListener('scroll', () => {
    const isNearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 120;
    if (isNearBottom) {
      scrollPill.classList.remove('visible');
    }
  });

  scrollPill.addEventListener('click', () => {
    feed.scrollTop = feed.scrollHeight;
    scrollPill.classList.remove('visible');
  });

  // Multi-Chat System Init
  function initMultiChat() {
    if (chats.length === 0) {
      createNewChat();
    } else {
      currentChatId = chats[0].id;
      renderSidebarChats();
      renderCurrentChatMessages();
    }
  }

  function createNewChat() {
    const newChat = {
      id: 'chat_' + Date.now(),
      title: 'New Neural Stream',
      pinned: false,
      messages: []
    };
    chats.unshift(newChat);
    currentChatId = newChat.id;
    saveChats();
    renderSidebarChats();
    renderCurrentChatMessages();
    closeSidebar();
  }

  function saveChats() {
    localStorage.setItem(CHATS_STORAGE_KEY, JSON.stringify(chats));
  }

  function getCurrentChat() {
    return chats.find(c => c.id === currentChatId);
  }

  function renderSidebarChats() {
    chatList.innerHTML = '';
    
    const sorted = [...chats].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));

    sorted.forEach(chat => {
      const item = document.createElement('div');
      item.className = `chat-item ${chat.id === currentChatId ? 'active' : ''} ${chat.pinned ? 'pinned' : ''}`;
      
      item.innerHTML = `
        <span class="chat-item-title">${chat.pinned ? '📌 ' : ''}${chat.title}</span>
        <div class="chat-item-actions">
          <button class="chat-action-btn pin-btn" title="Pin Chat">${chat.pinned ? 'Unpin' : 'Pin'}</button>
          <button class="chat-action-btn del-btn" title="Delete Chat">✕</button>
        </div>
      `;

      item.onclick = (e) => {
        if (e.target.classList.contains('pin-btn')) {
          e.stopPropagation();
          chat.pinned = !chat.pinned;
          saveChats();
          renderSidebarChats();
        } else if (e.target.classList.contains('del-btn')) {
          e.stopPropagation();
          chats = chats.filter(c => c.id !== chat.id);
          saveChats();
          if (currentChatId === chat.id) currentChatId = chats[0]?.id || null;
          initMultiChat();
        } else {
          currentChatId = chat.id;
          renderSidebarChats();
          renderCurrentChatMessages();
          closeSidebar();
        }
      };
      chatList.appendChild(item);
    });
  }

  function renderCurrentChatMessages() {
    feed.innerHTML = '';
    const activeChat = getCurrentChat();
    if (!activeChat) return;

    if (activeChat.messages.length === 0) {
      renderMessageUI('ai', "NeuralWeave synchronized.\n\n✨ **Features Ready:**\n• Mobile Native Interface\n• Multi-Chat Sidebar & Pinning Enabled\n• Image Generator: `/image [prompt]`", false);
    } else {
      activeChat.messages.forEach(msg => {
        renderMessageUI(msg.role === 'user' ? 'user' : 'ai', msg.content, false);
      });
    }
    feed.scrollTop = feed.scrollHeight;
  }

  function parseMarkdown(text) {
    text = text.replace(/```(\w*)\n([\s\S]*?)```/g, (match, lang, code) => {
      return `
        <div class="code-block-wrapper">
          <div class="code-header">
            <span>${lang || 'code'}</span>
            <button class="code-copy-btn" onclick="copyCodeSnippet(this)">Copy Code</button>
          </div>
          <pre><code>${code.trim()}</code></pre>
        </div>`;
    });

    let html = text
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^\*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^\*]+)\*/g, '<em>$1</em>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    return `<p>${html}</p>`;
  }

  window.copyCodeSnippet = function(btn) {
    const code = btn.parentElement.nextElementSibling.innerText;
    navigator.clipboard.writeText(code);
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.textContent = 'Copy Code'; }, 2000);
  };

  function renderMessageUI(role, text, save = true, isImage = false, imageUrl = '') {
    const w = document.createElement('div');
    w.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
    
    const a = document.createElement('div');
    a.className = 'av ' + (role === 'user' ? 'usr' : 'ai');
    a.textContent = role === 'user' ? 'YOU' : 'NW';
    
    const b = document.createElement('div');
    b.className = 'bub';

    if (isImage && imageUrl) {
      b.innerHTML = parseMarkdown(text);
      const img = document.createElement('img');
      img.src = imageUrl; img.className = 'chat-img';
      b.appendChild(img);
    } else {
      b.innerHTML = parseMarkdown(text);
    }

    w.append(a, b);
    feed.append(w);

    const isNearBottom = feed.scrollHeight - feed.scrollTop - feed.clientHeight < 140;
    if (!isNearBottom && role === 'ai') {
      scrollPill.classList.add('visible');
    } else {
      feed.scrollTop = feed.scrollHeight;
    }

    if (save) {
      const activeChat = getCurrentChat();
      if (activeChat) {
        if (activeChat.messages.length === 0 && role === 'user') {
          activeChat.title = text.slice(0, 24) || 'New Chat';
        }
        activeChat.messages.push({ role, content: text });
        saveChats();
        renderSidebarChats();
      }
    }
  }

  async function send() {
    let text = inp.value.trim();
    if (!text && !attachedFile) return;

    inp.value = ''; inp.style.height = 'auto';
    btn.disabled = true;

    renderMessageUI('user', text, true);

    if (text.toLowerCase().startsWith('/image')) {
      let prompt = text.replace(/^\/image\s*/i, '');
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=768&height=512&nologo=true`;
      renderMessageUI('ai', `Generated visual stream for: "${prompt}"`, true, true, imageUrl);
      btn.disabled = false;
      return;
    }

    const personas = {
      casual: "Be casual, friendly, smart, and concise.",
      professional: "Be highly professional, structured, objective, and clear.",
      educational: "Be an encouraging tutor. Break down complex topics step-by-step with examples.",
      formal: "Use strict formal language, high precision, and academic tone.",
      code: "You are a master Software Engineer. Provide clean, well-documented, optimal code blocks."
    };

    const modelLengths = {
      flash: "IMPORTANT: Keep responses extremely brief and short (under 2-3 sentences max).",
      pro: "Provide standard detailed explanations.",
      max: "Provide comprehensive, deeply thorough, and exhaustive answers with rich context."
    };

    const systemPrompt = `${personas[personaSelect.value]} ${modelLengths[modelSelect.value]}`;
    
    const activeChat = getCurrentChat();
    const history = activeChat ? activeChat.messages.map(m => ({ role: m.role === 'user' ? 'user' : 'assistant', content: m.content })) : [];

    try {
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
        body: JSON.stringify({
          model: 'openai/gpt-oss-20b',
          messages: [{ role: 'system', content: systemPrompt }, ...history],
          temperature: 0.7
        })
      });
      const data = await res.json();
      if (data.choices?.[0]) {
        renderMessageUI('ai', data.choices[0].message.content, true);
      } else {
        renderMessageUI('ai', '⚠ Error fetching response. Please check API Key.', false);
      }
    } catch(e) {
      renderMessageUI('ai', '⚠ Local Error: ' + e.message, false);
    }

    btn.disabled = false;
  }

  document.getElementById('new-chat-btn').onclick = createNewChat;
  btn.onclick = send;
  inp.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };

  initMultiChat();
</script>
</body>
</html>
